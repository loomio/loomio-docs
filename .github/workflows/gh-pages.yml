name: github pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'

      - run: mdbook build en
      - name: Check redirects
        run: bash check-redirects.sh
      - name: Check internal links and images
        run: bash check-links.sh
      - run: mkdir ./public
      - run: cp -R static/* ./public/
      - run: mv ./en/book/* ./public/en/
      - name: Fix canonical URLs (.md -> .html)
        run: find ./public/en -name '*.html' -exec sed -i 's|canonical" href="\(.*\)\.md"|canonical" href="\1.html"|g' {} +
      - name: Make redirect canonicals absolute
        run: find ./public/en -name '*.html' -exec sed -i 's|rel="canonical" href="/en/|rel="canonical" href="https://help.loomio.com/en/|' {} +
      - name: Consolidate duplicated mdBook landing page
        run: sed -i 's|https://help.loomio.com/en/index.html|https://help.loomio.com/en/user_manual/overview/index.html|' ./public/en/index.html
      - name: Generate page descriptions
        run: node generate-meta-descriptions.js ./public/en
      - run: bash generate-sitemap.sh
      - name: Check search metadata and sitemap
        run: bash check-seo.sh

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
